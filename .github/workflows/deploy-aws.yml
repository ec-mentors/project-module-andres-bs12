name: 🚀 Test, Build & Deploy to AWS

on:
  # Disparador manual para decidir cuándo actualizar la versión en AWS
  workflow_dispatch:
    inputs:
      skip_postman_tests:
        description: '¿Saltar pruebas de Postman antes del deploy? (false recomendado)'
        required: false
        type: boolean
        default: false
      deployment_note:
        description: 'Nota o versión de este despliegue'
        required: false
        type: string
        default: 'Despliegue manual desde GitHub Actions'

  # Opcional: También se puede disparar automáticamente al crear un tag de versión (ej: v1.0.1)
  push:
    tags:
      - 'v*.*.*'

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'nutrition-tracker' }}

jobs:
  # =========================================================================
  # ETAPA 1: Quality Gate con Postman (Newman) y Tests Unitarios
  # =========================================================================
  quality-gate-postman:
    name: 🧪 Quality Gate (Postman Tests)
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_postman_tests }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutrition_tracker
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 📦 Configurar Node.js (Frontend & Newman)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🛠️ Compilar Frontend (React Vite)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 🧪 Ejecutar Tests Unitarios de Spring Boot
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nutrition_tracker
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpassword
          OPENAI_MEAL_PARSER_KEY: test-key-dummy

      - name: 📦 Empaquetar JAR de Spring Boot
        run: mvn package -DskipTests

      - name: 🏃 Iniciar Backend en Background para Pruebas E2E
        run: |
          java -jar target/NutritionTracker-0.0.1-SNAPSHOT.jar &
          echo "Esperando a que la API responda en http://localhost:8080..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/user > /dev/null; then
              echo "✅ Backend listo!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ El backend no inició a tiempo"
          exit 1
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nutrition_tracker
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpassword
          OPENAI_MEAL_PARSER_KEY: test-key-dummy

      - name: 📬 Ejecutar Suite Automatizada de Postman con Newman
        run: |
          npx newman run postman/NutritionTracker.postman_collection.json \
            -e postman/NutritionTracker.local.postman_environment.json \
            --reporters cli

  # =========================================================================
  # ETAPA 2: Construir Imagen Docker y Subir a Amazon ECR
  # =========================================================================
  build-and-push-ecr:
    name: 🐳 Docker Build & Push a ECR
    runs-on: ubuntu-latest
    needs: [quality-gate-postman]
    if: always() && (needs.quality-gate-postman.result == 'success' || needs.quality-gate-postman.result == 'skipped')

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔑 Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Construir y Publicar Imagen Docker en ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

  # =========================================================================
  # ETAPA 3: Despliegue en AWS (App Runner / ECS)
  # =========================================================================
  deploy-to-aws:
    name: 🌐 Desplegar en AWS
    runs-on: ubuntu-latest
    needs: [build-and-push-ecr]

    steps:
      - name: 🔑 Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Opción 1: Despliegue en AWS App Runner (Recomendado para contenedor único con link HTTPS)
      - name: 🚀 Actualizar AWS App Runner
        if: "${{ secrets.APP_RUNNER_SERVICE_ARN != '' }}"
        run: |
          echo "Iniciando despliegue en AWS App Runner..."
          aws apprunner start-deployment --service-arn ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          echo "✅ Despliegue disparado en AWS App Runner con éxito!"

      # Opción 2: Despliegue en AWS ECS Fargate (Si usas ECS)
      - name: 🚀 Actualizar AWS ECS Service
        if: "${{ secrets.ECS_CLUSTER_NAME != '' && secrets.ECS_SERVICE_NAME != '' }}"
        run: |
          echo "Forzando nuevo despliegue en AWS ECS..."
          aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER_NAME }} --service ${{ secrets.ECS_SERVICE_NAME }} --force-new-deployment
          echo "✅ Despliegue disparado en AWS ECS con éxito!"
