name: Setup HTTPS on EC2

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Public domain (e.g. nutrition.andresbejarano.com)'
        required: true
        type: string
        default: 'nutrition.andresbejarano.com'
      email:
        description: 'Email for Let''s Encrypt registration'
        required: true
        type: string
        default: 'abs.personal12@gmail.com'

jobs:
  setup-https:
    name: Enable HTTPS on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Install certbot and configure nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            DOMAIN="${{ inputs.domain }}"
            EMAIL="${{ inputs.email }}"

            sudo apt-get update
            sudo apt-get install -y nginx certbot python3-certbot-nginx

            sudo tee /etc/nginx/sites-available/nutritiontracker >/dev/null <<'NGINX'
            server {
                listen 80;
                server_name DOMAIN_PLACEHOLDER;

                location / {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX

            sudo sed -i "s/DOMAIN_PLACEHOLDER/${DOMAIN}/g" /etc/nginx/sites-available/nutritiontracker

            sudo ln -sf /etc/nginx/sites-available/nutritiontracker /etc/nginx/sites-enabled/nutritiontracker
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx

            sudo certbot --nginx -d "${DOMAIN}" --non-interactive --agree-tos -m "${EMAIL}" --redirect

            echo "HTTPS ready at https://${DOMAIN}"
