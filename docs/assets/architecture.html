<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutritionTracker · System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1040px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>NutritionTracker System & Data Flow</h1>

    <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">NutritionTracker System & Data Flow</title>
      <desc id="architecture-desc">Architecture diagram showing requests moving from React SPA through Security Gateway to Spring Boot REST Core, Spring AI OpenAI integration, and PostgreSQL.</desc>
      
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.08)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

      <!-- Zone: Core Backend & Data Services -->
      <rect x="440" y="40" width="480" height="276" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="456" y="44" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="494" y="53" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">BACKEND TIER</text>

      <!-- Connectors (drawn before nodes) -->
      <!-- 1. Client -> Security Gateway -->
      <line x1="184" y1="168" x2="248" y2="168" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      
      <!-- 2. Security Gateway -> Spring Boot Core -->
      <line x1="392" y1="168" x2="456" y2="168" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- 3. Spring Boot Core -> Spring AI (Right + Up) -->
      <path d="M 608,148 H 664 Q 672,148 672,140 V 108 Q 672,100 680,100 H 712"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 4. Spring Boot Core -> PostgreSQL (Right + Down) -->
      <path d="M 608,188 H 664 Q 672,188 672,196 V 228 Q 672,236 680,236 H 712"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Connector Labels (with opaque mask rects and 6-10px gaps) -->
      <rect x="194" y="148" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="157" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

      <rect x="398" y="148" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="157" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OIDC JWT</text>

      <rect x="632" y="80" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="89" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROMPT / AUDIO</text>

      <rect x="636" y="244" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JPA / SQL</text>

      <!-- Node 1: React 19 Client -->
      <rect x="40" y="136" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="136" width="144" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="144" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="64" y="153" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="112" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React 19 SPA</text>
      <text x="112" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Nutria Omnibar</text>

      <!-- Node 2: Security Gateway -->
      <rect x="248" y="136" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="136" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="256" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="270" y="153" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
      <text x="320" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Security Gateway</text>
      <text x="320" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Google OIDC + RBAC</text>

      <!-- Node 3: Spring Boot 3 Core (Focal Accent) -->
      <rect x="456" y="132" width="152" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="132" width="152" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="464" y="140" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="480" y="149" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="532" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spring Boot 3 API</text>
      <text x="532" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">REST · Services</text>

      <!-- Node 4: Spring AI / OpenAI -->
      <rect x="712" y="68" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="68" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="720" y="76" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="736" y="85" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="796" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spring AI · OpenAI</text>
      <text x="796" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPT-5.6 &amp; Whisper</text>

      <!-- Node 5: PostgreSQL Database -->
      <rect x="712" y="204" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="204" width="168" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="720" y="212" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="734" y="221" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="796" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL 16</text>
      <text x="796" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">users · goal · entry</text>

      <!-- Legend Strip -->
      <line x1="40" y1="340" x2="920" y2="340" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="372" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="380" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / Spring Core</text>

      <rect x="200" y="372" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="380" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">AI Engine</text>

      <rect x="330" y="372" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="350" y="380" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Database Store</text>

      <rect x="480" y="372" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="500" y="380" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Client / Input</text>

      <line x1="620" y1="378" x2="648" y2="378" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="656" y="380" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP Request</text>

      <line x1="770" y1="378" x2="798" y2="378" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="806" y="380" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Auth Flow</text>
    </svg>
  </div>
</body>
</html>
