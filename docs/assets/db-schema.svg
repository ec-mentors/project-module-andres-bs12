<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dbschema-title dbschema-desc">
  <title id="dbschema-title">NutritionTracker Relational Schema</title>
  <desc id="dbschema-desc">Database schema diagram showing PostgreSQL physical tables users, goal, and entry with column-level foreign keys and cascade rules.</desc>
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.08)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- Schema Grouping: public -->
  <rect x="24" y="24" width="912" height="428" rx="8"
        fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect x="40" y="28" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="70" y="37" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.14em">PUBLIC</text>

  <!-- Connectors (FK Edges drawn before tables) -->
  <!-- FK 1: goal.user_id -> users.id (ON DELETE CASCADE) -->
  <path d="M 580,116 H 480 Q 472,116 472,120 V 120 Q 472,124 464,124 H 308"
        fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- FK 2: entry.user_id -> users.id (ON DELETE CASCADE) -->
  <path d="M 580,324 H 392 Q 384,324 384,316 V 140 Q 384,132 376,132 H 308"
        fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Connector Labels with Masks -->
  <rect x="400" y="96" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="452" y="105" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON DELETE CASCADE</text>

  <rect x="332" y="228" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="384" y="237" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON DELETE CASCADE</text>

  <!-- ================= TABLE 1: public.users ================= -->
  <!-- Outer container -->
  <rect x="48" y="72" width="260" height="176" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="72" width="260" height="176" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <!-- Header band -->
  <rect x="48" y="72" width="260" height="32" rx="6" fill="rgba(235,108,54,0.08)"/>
  <rect x="48" y="98" width="260" height="6" fill="rgba(235,108,54,0.08)"/>
  <line x1="48" y1="104" x2="308" y2="104" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <rect x="56" y="80" width="36" height="14" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="74" y="90" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
  <text x="100" y="91" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">public.users</text>

  <!-- Row 1: id (PK) -->
  <rect x="48" y="104" width="260" height="24" fill="rgba(45,49,66,0.02)"/>
  <text x="60" y="120" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">id</text>
  <rect x="180" y="110" width="18" height="12" rx="2" fill="rgba(235,108,54,0.12)"/>
  <text x="189" y="119" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PK</text>
  <text x="296" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

  <!-- Row 2: google_id (UQ) -->
  <text x="60" y="144" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">google_id</text>
  <rect x="180" y="134" width="18" height="12" rx="2" fill="rgba(45,49,66,0.08)"/>
  <text x="189" y="143" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">UQ</text>
  <text x="296" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>

  <!-- Row 3: email (UQ) -->
  <rect x="48" y="152" width="260" height="24" fill="rgba(45,49,66,0.02)"/>
  <text x="60" y="168" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">email</text>
  <rect x="180" y="158" width="18" height="12" rx="2" fill="rgba(45,49,66,0.08)"/>
  <text x="189" y="167" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">UQ</text>
  <text x="296" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>

  <!-- Row 4: telegram_chat_id -->
  <text x="60" y="192" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">telegram_chat_id</text>
  <rect x="180" y="182" width="18" height="12" rx="2" fill="rgba(45,49,66,0.08)"/>
  <text x="189" y="191" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">UQ</text>
  <text x="296" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">bigint</text>

  <!-- Row 5: created_at -->
  <rect x="48" y="200" width="260" height="24" fill="rgba(45,49,66,0.02)"/>
  <text x="60" y="216" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">created_at</text>
  <text x="296" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">timestamptz</text>

  <!-- Row 6: +2 more columns (role, names) -->
  <text x="60" y="238" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">+ 3 more fields (role, names)</text>

  <!-- ================= TABLE 2: public.goal ================= -->
  <!-- Outer container -->
  <rect x="580" y="48" width="312" height="184" rx="6" fill="#f5f5f5"/>
  <rect x="580" y="48" width="312" height="184" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <!-- Header band -->
  <rect x="580" y="48" width="312" height="32" rx="6" fill="rgba(45,49,66,0.03)"/>
  <rect x="580" y="74" width="312" height="6" fill="rgba(45,49,66,0.03)"/>
  <line x1="580" y1="80" x2="892" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <rect x="588" y="56" width="36" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
  <text x="606" y="66" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
  <text x="632" y="67" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">public.goal</text>

  <!-- Row 1: id (PK) -->
  <rect x="580" y="80" width="312" height="24" fill="rgba(45,49,66,0.02)"/>
  <text x="592" y="96" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">id</text>
  <rect x="712" y="86" width="18" height="12" rx="2" fill="rgba(45,49,66,0.08)"/>
  <text x="721" y="95" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PK</text>
  <text x="880" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

  <!-- Row 2: user_id (FK) -->
  <text x="592" y="120" fill="#eb6c36" font-size="11" font-weight="500" font-family="'Geist', sans-serif">user_id</text>
  <rect x="712" y="110" width="18" height="12" rx="2" fill="rgba(235,108,54,0.12)"/>
  <text x="721" y="119" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">FK</text>
  <text x="880" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

  <!-- Row 3: start_date -->
  <rect x="580" y="128" width="312" height="24" fill="rgba(45,49,66,0.02)"/>
  <text x="592" y="144" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">start_date</text>
  <rect x="704" y="134" width="32" height="12" rx="2" fill="rgba(45,49,66,0.08)"/>
  <text x="720" y="143" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">UK(u,d)</text>
  <text x="880" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">date</text>

  <!-- Row 4: kcal -->
  <text x="592" y="168" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">kcal</text>
  <text x="880" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">integer</text>

  <!-- Row 5: protein / carbs / fat -->
  <rect x="580" y="176" width="312" height="24" fill="rgba(45,49,66,0.02)"/>
  <text x="592" y="192" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">protein, carbs, fat</text>
  <text x="880" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">double precision</text>

  <!-- Row 6: Index note -->
  <text x="592" y="216" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace">UK: uk_user_goal_date(user_id, start_date)</text>

  <!-- ================= TABLE 3: public.entry ================= -->
  <!-- Outer container -->
  <rect x="580" y="256" width="312" height="184" rx="6" fill="#f5f5f5"/>
  <rect x="580" y="256" width="312" height="184" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <!-- Header band -->
  <rect x="580" y="256" width="312" height="32" rx="6" fill="rgba(45,49,66,0.03)"/>
  <rect x="580" y="282" width="312" height="6" fill="rgba(45,49,66,0.03)"/>
  <line x1="580" y1="288" x2="892" y2="288" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <rect x="588" y="264" width="36" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
  <text x="606" y="274" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
  <text x="632" y="275" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">public.entry</text>

  <!-- Row 1: id (PK) -->
  <rect x="580" y="288" width="312" height="24" fill="rgba(45,49,66,0.02)"/>
  <text x="592" y="304" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">id</text>
  <rect x="712" y="294" width="18" height="12" rx="2" fill="rgba(45,49,66,0.08)"/>
  <text x="721" y="303" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PK</text>
  <text x="880" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

  <!-- Row 2: user_id (FK) -->
  <text x="592" y="328" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">user_id</text>
  <rect x="712" y="318" width="18" height="12" rx="2" fill="rgba(45,49,66,0.08)"/>
  <text x="721" y="327" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">FK</text>
  <text x="880" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

  <!-- Row 3: meal_name -->
  <rect x="580" y="336" width="312" height="24" fill="rgba(45,49,66,0.02)"/>
  <text x="592" y="352" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">meal_name, source</text>
  <text x="880" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>

  <!-- Row 4: created_on -->
  <text x="592" y="376" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">created_on</text>
  <text x="880" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">timestamptz</text>

  <!-- Row 5: kcal, macros -->
  <rect x="580" y="384" width="312" height="24" fill="rgba(45,49,66,0.02)"/>
  <text x="592" y="400" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">kcal, protein, carbs, fat</text>
  <text x="880" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">int, double</text>

  <!-- Row 6: Note -->
  <text x="592" y="424" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace">FK references users(id) CASCADE</text>

  <!-- Legend Strip -->
  <line x1="40" y1="468" x2="920" y2="468" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="40" y="496" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="60" y="504" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary Entity (users)</text>

  <rect x="220" y="496" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="240" y="504" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Relational Table</text>

  <line x1="380" y1="502" x2="408" y2="502" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="416" y="504" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Foreign Key Cascade</text>

  <line x1="580" y1="502" x2="608" y2="502" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="616" y="504" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Foreign Key Reference</text>
</svg>
