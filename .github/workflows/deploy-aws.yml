name: 🚀 Test, Build & Deploy to AWS

on:
  # Manual trigger to deploy to AWS on demand
  workflow_dispatch:
    inputs:
      skip_postman_tests:
        description: 'Skip Postman tests before deploy? (false recommended)'
        required: false
        type: boolean
        default: false
      deployment_note:
        description: 'Deployment note or version label'
        required: false
        type: string
        default: 'Manual deployment triggered from GitHub Actions'

  # Optional: Also triggers automatically when creating a version tag (e.g., v1.0.1)
  push:
    tags:
      - 'v*.*.*'

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'nutrition-tracker' }}

jobs:
  # =========================================================================
  # STAGE 1: Quality Gate with Postman (Newman) & Unit Tests
  # =========================================================================
  quality-gate-postman:
    name: 🧪 Quality Gate (Postman Tests)
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_postman_tests }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutrition_tracker
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 📦 Setup Node.js (Frontend & Newman)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🛠️ Build Frontend Bundle (React Vite)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 🧪 Run Spring Boot Unit Tests
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nutrition_tracker
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpassword
          OPENAI_MEAL_PARSER_KEY: test-key-dummy
          JWT_SECRET: super-secret-key-for-jwt-testing-minimum-256-bits-length-guaranteed

      - name: 📦 Package Spring Boot JAR
        run: mvn package -DskipTests

      - name: 🏃 Start Backend in Background for E2E Tests
        run: |
          java -jar target/NutritionTracker-0.0.1-SNAPSHOT.jar &
          echo "Waiting for backend API to respond at http://localhost:8080..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/user > /dev/null; then
              echo "✅ Backend is ready and healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Backend failed to start within timeout"
          exit 1
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nutrition_tracker
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpassword
          OPENAI_MEAL_PARSER_KEY: test-key-dummy
          JWT_SECRET: super-secret-key-for-jwt-testing-minimum-256-bits-length-guaranteed

      - name: 📬 Execute Automated Postman Test Suite with Newman
        run: |
          npx newman run postman/NutritionTracker.postman_collection.json \
            -e postman/NutritionTracker.local.postman_environment.json \
            --reporters cli

  # =========================================================================
  # STAGE 2: Build Docker Image & Push to Amazon ECR
  # =========================================================================
  build-and-push-ecr:
    name: 🐳 Docker Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [quality-gate-postman]
    if: always() && (needs.quality-gate-postman.result == 'success' || needs.quality-gate-postman.result == 'skipped')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Authenticate with Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build & Publish Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

  # =========================================================================
  # STAGE 3: Deploy to AWS (App Runner / ECS / EC2)
  # =========================================================================
  deploy-to-aws:
    name: 🌐 Deploy to AWS
    runs-on: ubuntu-latest
    needs: [build-and-push-ecr]

    steps:
      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Option 1: AWS App Runner Deployment (Single container with HTTPS URL)
      - name: 🚀 Update AWS App Runner Service
        if: "${{ secrets.APP_RUNNER_SERVICE_ARN != '' }}"
        run: |
          echo "Triggering deployment on AWS App Runner..."
          aws apprunner start-deployment --service-arn ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          echo "✅ Deployment triggered on AWS App Runner successfully!"

      # Option 2: AWS ECS Fargate Deployment
      - name: 🚀 Update AWS ECS Service
        if: "${{ secrets.ECS_CLUSTER_NAME != '' && secrets.ECS_SERVICE_NAME != '' }}"
        run: |
          echo "Forcing new deployment on AWS ECS..."
          aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER_NAME }} --service ${{ secrets.ECS_SERVICE_NAME }} --force-new-deployment
          echo "✅ Deployment triggered on AWS ECS successfully!"

      # Option 3: AWS EC2 Deployment via SSH
      - name: 🚀 Update AWS EC2 via SSH
        if: "${{ secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting container update on EC2..."
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            docker stop nutrition-tracker-prod || true
            docker rm nutrition-tracker-prod || true
            docker run -d --name nutrition-tracker-prod -p 8080:8080 --restart always \
              -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
              -e OPENAI_MEAL_PARSER_KEY="${{ secrets.OPENAI_MEAL_PARSER_KEY }}" \
              -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            echo "✅ Container updated on EC2 successfully!"
