spring.application.name=NutritionTracker

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/nutrition_tracker
spring.datasource.username=andresbejarano
spring.datasource.password=

# JPA / Hibernate Configuration
# update: Inspects entities and updates table schemas without dropping data.
# create: Drops existing tables and recreates them on startup (use for clean dev resets).
spring.jpa.hibernate.ddl-auto=update

# Logging & Dialect Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Script Initialization (never: let Hibernate manage schemas; always: run schema.sql on startup)
spring.sql.init.mode=never

# Spring AI - OpenAI Configuration - Goal
spring.ai.openai.api-key=${OPENAI_MEAL_PARSER_KEY}
spring.ai.openai.chat.options.model=gpt-5.6-luna
spring.ai.openai.chat.options.temperature=1.0

# Spring AI - OpenAI Audio Transcription (Whisper)
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=en
spring.ai.openai.audio.transcription.options.temperature=0

# Telegram
telegram.bot.name=NutritionTracker_2Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-days=30

# Google OAuth (must match VITE_GOOGLE_CLIENT_ID / GIS Web client).
# Default matches docker-compose / local frontend/.env so IntelliJ can start without extra env.
# Production overrides via GOOGLE_OAUTH_CLIENT_ID (same value as VITE_GOOGLE_CLIENT_ID).
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:1087959369951-bku0n43d7onoujtri42s297a4eu93n4q.apps.googleusercontent.com}


