spring.application.name=NutritionTracker

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/nutrition_tracker
spring.datasource.username=andresbejarano
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Run schema.sql on startup if tables don't exist. "always" to restarwt
spring.sql.init.mode=never
