# Test classpath application.properties shadows the main file, so this
# must include every property the context needs — not only JWT.
spring.datasource.url=jdbc:h2:mem:nutrition_tracker;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

telegram.bot.name=TestBot
telegram.bot.token=

spring.ai.openai.api-key=test-key-dummy
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=1.0

jwt.secret=super-secret-key-for-jwt-testing-minimum-256-bits-length-guaranteed
jwt.expiration-days=30
